  /* 一時的な起動エラー診断：4秒経っても #root が空なら、捕捉したエラーを画面に表示する */
  (function(){
    var buf=[];
    function cap(m){ buf.push(m); }
    window.addEventListener('error', function(e){
      cap('[error] '+(e.message||'')+(e.filename?(' @ '+e.filename+':'+(e.lineno||0)):'')+(e.error&&e.error.stack?('\n'+e.error.stack):''));
    });
    window.addEventListener('unhandledrejection', function(e){
      var r=e.reason; cap('[promise] '+((r&&r.message)?r.message:String(r))+((r&&r.stack)?('\n'+r.stack):''));
    });
    setTimeout(function(){
      var root=document.getElementById('root');
      if(root && root.children.length>0) return; /* 正常に描画済みなら何もしない */
      var d=document.createElement('div');
      d.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;color:#b00020;font:12px/1.6 monospace;padding:16px;white-space:pre-wrap;overflow:auto;-webkit-user-select:text;user-select:text;';
      d.textContent='CABIN 起動エラー診断（一時表示）\n\n'+(buf.length?buf.join('\n\n'):'(JSエラーは捕捉されていません→読み込み/ネットワークの可能性)')+'\n\nUA: '+navigator.userAgent;
      (document.body||document.documentElement).appendChild(d);
    }, 4000);
  })();
  </script>

    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  
    /* Header text override */
    header .text-gray-800,
    header .text-gray-700,
    header .text-gray-600,
    header .text-gray-500,
    header .text-gray-400,
    header .text-gray-300,
    header .text-gray-900,
    header span,
    header button,
    header a {
      color: #FFFFFF !important;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.6) !important;
    }
    header button {
      opacity: 1 !important;
      font-weight: bold !important;
    }
    header svg {
      filter: drop-shadow(0 1px 3px rgba(0,0,0,1));
      color: #FFFFFF !important;
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in-up 0.3s ease-out;
    }
