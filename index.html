  <title>CABIN</title>
  <script>
  /* 起動診断（常設）：5秒経っても画面が出ない場合、原因を表示する */
  (function(){
    var buf=[];
    function cap(m){ if(buf.length<10) buf.push(m); }
    window.addEventListener('error', function(e){
      cap('[error] '+(e.message||'')+(e.filename?(' @ '+String(e.filename).slice(0,80)+':'+(e.lineno||0)):''));
    });
    window.addEventListener('unhandledrejection', function(e){
      var r=e.reason; cap('[promise] '+((r&&r.message)?r.message:String(r)));
    });
    setTimeout(function(){
      var root=document.getElementById('root');
      if(root && root.children.length>0) return;            /* アプリ描画済み */
      if(document.getElementById('cabin-login')) return;     /* ログイン画面表示済み */
      var imOk = (typeof HTMLScriptElement!=='undefined' && HTMLScriptElement.supports) ? HTMLScriptElement.supports('importmap') : false;
      var d=document.createElement('div');
      d.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;color:#333;font-family:sans-serif;padding:20px;overflow:auto;-webkit-user-select:text;user-select:text;';
      var advice = imOk
        ? '通信環境をご確認のうえ、下のボタンで再読み込みしてください。直らない場合はこの画面を撮影して松前までお知らせください。'
        : 'お使いのiPhone/iPadのiOSが古い可能性があります（iOS 16.4以上が必要）。「設定 → 一般 → ソフトウェアアップデート」で更新してください。';
      d.innerHTML =
        '<div style="max-width:480px;margin:0 auto">'+
        '<div style="font-size:18px;font-weight:700;margin:16px 0 8px">⚠️ アプリを起動できませんでした</div>'+
        '<div style="font-size:14px;line-height:1.7;color:#555">'+advice+'</div>'+
        '<button onclick="location.reload(true)" style="margin:16px 0;padding:12px 24px;background:#2563eb;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:600">再読み込み</button>'+
        '<div style="font-size:11px;color:#999;white-space:pre-wrap;border-top:1px solid #eee;padding-top:10px">'+
        'importmap対応: '+imOk+'\n'+
        (buf.length?buf.join('\n'):'(JSエラーなし → 読み込み/ネットワークの可能性)')+'\n'+
        'UA: '+navigator.userAgent+'</div></div>';
      (document.body||document.documentElement).appendChild(d);
    }, 5000);
  })();
  </script>

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  
    /* Header text override */
    header .text-gray-800,
    header .text-gray-700,
    header .text-gray-600,
    header .text-gray-500,
    header .text-gray-400,
    header .text-gray-300,
    header .text-gray-900,
    header span,
    header button,
    header a {
      color: #FFFFFF !important;
      text-shadow: 0 1px 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.6) !important;
    }
    header button {
      opacity: 1 !important;
      font-weight: bold !important;
    }
    header svg {
      filter: drop-shadow(0 1px 3px rgba(0,0,0,1));
      color: #FFFFFF !important;
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in-up 0.3s ease-out;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="module">
    // === CABIN 本物ログインの門（Supabase Auth） ===
    // 本物のログインに成功した人だけアプリ本体(@/index)を読み込む。
    // 同じ supabase クライアント(@/supabaseClient)を使うので、ログイン後の通信はすべて認証済み＝RLSを通過する。
    import { supabase } from '@/supabaseClient';

    function showLogin(message) {
      var rootEl = document.getElementById('root');
      if (rootEl) rootEl.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f9fafb;font-family:system-ui,sans-serif;z-index:99999';
      wrap.innerHTML =
        '<form id="cabin-login" style="background:#fff;padding:28px 24px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);width:320px;max-width:90vw">' +
          '<div style="font-size:20px;font-weight:700;margin-bottom:4px">CABIN ログイン</div>' +
          '<div style="font-size:12px;color:#6b7280;margin-bottom:16px">部署の共通アカウントでログインしてください</div>' +
          '<input id="cabin-email" type="email" placeholder="メールアドレス" autocomplete="username" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:10px;font-size:14px">' +
          '<input id="cabin-pass" type="password" placeholder="パスワード" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:12px;font-size:14px">' +
          '<button type="submit" style="width:100%;padding:11px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">ログイン</button>' +
          '<div id="cabin-err" style="color:#dc2626;font-size:12px;margin-top:10px;min-height:16px"></div>' +
        '</form>';
      document.body.appendChild(wrap);
      var errEl = wrap.querySelector('#cabin-err');
      if (message) errEl.textContent = message;
      wrap.querySelector('#cabin-login').addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = wrap.querySelector('button');
        btn.disabled = true; btn.textContent = '確認中...';
        errEl.textContent = '';
        var email = wrap.querySelector('#cabin-email').value.trim();
        var password = wrap.querySelector('#cabin-pass').value;
        var res = await supabase.auth.signInWithPassword({ email: email, password: password });
        if (res.error) {
          errEl.textContent = 'ログインに失敗しました（メール／パスワードをご確認ください）';
          btn.disabled = false; btn.textContent = 'ログイン';
          return;
        }
        location.reload();
      });
    }

    try {
      var s = await supabase.auth.getSession();
      if (s && s.data && s.data.session) {
        await import('@/index');   // ログイン済み → アプリ本体を起動
      } else {
        showLogin('');             // 未ログイン → ログイン画面
      }
    } catch (err) {
      showLogin('接続エラーが発生しました。時間をおいて再読み込みしてください。');
    }
  </script>
</body>
</html>
